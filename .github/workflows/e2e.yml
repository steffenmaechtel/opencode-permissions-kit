name: e2e

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode version
        id: version
        run: |
          echo "OC_VERSION=$(curl -fsSL https://api.github.com/repos/anomalyco/opencode/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binary (per version)
        uses: actions/cache@v4
        with:
          path: tests/e2e/cache
          key: opencode-e2e-${{ steps.version.outputs.OC_VERSION }}
      - name: Run E2E test
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/test-wrapper-validation.sh ./tests/test-project-config.sh ./tests/test-hooks.sh ./tests/test-jsonc-parser.sh ./tests/test-git-config.sh \
            ./files/opencode-lib/hooks/post-checkout ./files/opencode-lib/hooks/post-merge ./files/opencode-lib/hooks/post-commit \
            ./files/config.sh ./files/update.sh ./files/install.sh ./files/uninstall.sh ./files/status.sh \
            ./files/opencode-lib/protect-projects.sh ./files/opencode-lib/wrapper ./files/opencode-lib/log.sh
          ./tests/e2e/run.sh
