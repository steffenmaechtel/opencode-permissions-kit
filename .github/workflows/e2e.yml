name: e2e

on:
  workflow_dispatch:
  push:
    branches:
      - master

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode version
        id: version
        run: |
          echo "OC_VERSION=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 https://api.github.com/repos/anomalyco/opencode/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^OLD_VERSION="\([0-9.]*\)".*/\1/p' tests/e2e/run.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per version)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          # Exact key for the (OLD, latest) combo. When the latest opencode
          # bumps, restore-keys below reuses the previous cache (same OLD +
          # installer), so run.sh only re-downloads the one new binary.
          key: opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-latest${{ steps.version.outputs.OC_VERSION }}
          restore-keys: |
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run E2E test
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/test-wrapper-validation.sh ./tests/test-project-config.sh ./tests/test-hooks.sh ./tests/test-jsonc-parser.sh ./tests/test-git-config.sh ./tests/test-ddev-shim.sh ./tests/test-container-backend.sh ./tests/test-bypass-guard.sh \
            ./files/opencode-permissions-kit-lib/hooks/post-checkout ./files/opencode-permissions-kit-lib/hooks/post-merge ./files/opencode-permissions-kit-lib/hooks/post-commit \
            ./files/config.sh ./files/update.sh ./files/install.sh ./files/uninstall.sh ./files/status.sh \
            ./files/opencode-permissions-kit-lib/protect-projects.sh ./files/opencode-permissions-kit-lib/wrapper ./files/opencode-permissions-kit-lib/log.sh ./files/opencode-permissions-kit-lib/shell-warn.sh ./files/opencode-permissions-kit-lib/bin/ddev
          ./tests/e2e/run.sh
