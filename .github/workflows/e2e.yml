name: e2e

# Runs on manual dispatch, push to master, and pull requests targeting
# master. PRs get the e2e verdict before merge. A branch push with an open
# PR fires only `pull_request` (no `push` filter for other branches) — no
# double-run.
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode version
        id: version
        run: |
          echo "OC_VERSION=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 https://api.github.com/repos/anomalyco/opencode/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^OLD_VERSION="\([0-9.]*\)".*/\1/p' tests/e2e/run.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per version)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          # Exact key for the (OLD, latest) combo. When the latest opencode
          # bumps, restore-keys below reuses the previous cache (same OLD +
          # installer), so run.sh only re-downloads the one new binary.
          key: opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-latest${{ steps.version.outputs.OC_VERSION }}
          restore-keys: |
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run E2E test
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/lib.sh ./tests/test-wrapper-validation.sh ./tests/test-jsonc-parser.sh ./tests/test-git-config.sh ./tests/test-container-backend.sh ./tests/test-bypass-guard.sh ./tests/test-migration.sh ./tests/test-ddev-as-opencode.sh ./tests/test-mkcert-reuse.sh ./tests/test-wsl-exposure.sh ./tests/test-ui.sh \
            ./files/config.sh ./files/update.sh ./files/install.sh ./files/uninstall.sh ./files/status.sh \
            ./files/opencode-permissions-kit-lib/wrapper ./files/opencode-permissions-kit-lib/log.sh ./files/opencode-permissions-kit-lib/ui.sh ./files/opencode-permissions-kit-lib/shell-warn.sh ./files/opencode-permissions-kit-lib/setup-container-backend.sh ./files/opencode-permissions-kit-lib/migrate-denies.sh ./files/opencode-permissions-kit-lib/bin/socket-check.sh ./files/opencode-permissions-kit-lib/ddev-as-opencode.sh ./files/opencode-permissions-kit-lib/ddev-handover.sh ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
          ./tests/e2e/run.sh

  # docker-rootless daemon e2e (Phase 3). Same triggers + shared binary cache;
  # needs systemd-in-container + nested user namespaces, and SKIPs wholesale
  # when the runner cannot provide them (see run-docker-rootless.sh).
  e2e-rootless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode version
        id: version
        run: |
          echo "OC_VERSION=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 https://api.github.com/repos/anomalyco/opencode/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^OLD_VERSION="\([0-9.]*\)".*/\1/p' tests/e2e/run.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per version, shared with e2e job)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          key: opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-latest${{ steps.version.outputs.OC_VERSION }}
          restore-keys: |
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run docker-rootless E2E test
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/lib.sh \
            ./tests/test-wrapper-validation.sh ./tests/test-jsonc-parser.sh ./tests/test-git-config.sh ./tests/test-container-backend.sh ./tests/test-bypass-guard.sh ./tests/test-migration.sh ./tests/test-ddev-as-opencode.sh ./tests/test-mkcert-reuse.sh ./tests/test-wsl-exposure.sh ./tests/test-ui.sh \
            ./files/config.sh ./files/update.sh ./files/install.sh ./files/uninstall.sh ./files/status.sh \
            ./files/opencode-permissions-kit-lib/wrapper ./files/opencode-permissions-kit-lib/log.sh ./files/opencode-permissions-kit-lib/ui.sh ./files/opencode-permissions-kit-lib/shell-warn.sh ./files/opencode-permissions-kit-lib/setup-container-backend.sh ./files/opencode-permissions-kit-lib/migrate-denies.sh ./files/opencode-permissions-kit-lib/bin/socket-check.sh ./files/opencode-permissions-kit-lib/ddev-as-opencode.sh ./files/opencode-permissions-kit-lib/ddev-handover.sh ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
          ./tests/e2e/run-docker-rootless.sh
