name: e2e

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run E2E test
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/test-wrapper-validation.sh ./tests/test-project-config.sh ./tests/test-hooks.sh ./tests/test-jsonc-parser.sh ./tests/test-git-config.sh \
            ./files/opencode-lib/hooks/post-checkout ./files/opencode-lib/hooks/post-merge ./files/opencode-lib/hooks/post-commit \
            ./files/config.sh ./files/update.sh ./files/install.sh ./files/uninstall.sh \
            ./files/opencode-lib/protect-projects.sh ./files/opencode-lib/wrapper
          ./tests/e2e/run.sh
