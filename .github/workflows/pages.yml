name: pages

# GitHub Pages entry site (short install URLs, issue context: line-length
# baseline debt of the raw.githubusercontent one-liners):
# steffenmaechtel.github.io/opencode-permissions-kit serves a landing page
# plus copies of install.sh / update.sh, so the docs one-liners get a
# 68/69-char URL instead of the 98/139-char raw URLs.
#
# Channel discipline: the SCRIPT copies always come from the `stable`
# release mirror — the public entry URLs must never serve dev state, no
# matter which ref triggered the run (a manual dispatch from master is
# fine for the landing page, but the scripts stay pinned to stable).
# Landing page template: from the triggering ref (at release time
# stable == master anyway).
#
# Pages settings must be ONCE set in the repo to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).

on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # delete this run's stale artifacts (re-run hygiene, issue #388)

# Deployments are sequential state machines — an in-flight deploy must
# not be cancelled halfway (official actions/deploy-pages pattern).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out the stable channel for the served scripts
        uses: actions/checkout@v7
        with:
          ref: stable
          path: stable
      - name: Assemble site
        run: |
          mkdir -p site
          cp .github/pages/index.md .github/pages/_config.yml site/
          cp stable/files/install.sh site/
          cp stable/files/opencode-permissions-kit-lib/management/update.sh site/
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: ./_site
      # Re-run hygiene (issue #388, run 41893900784): artifacts survive a
      # workflow re-run, and deploy-pages fails a run that carries more
      # than one artifact named github-pages ("Artifact count is 2") — so
      # re-running a failed pages run can never heal it. Delete THIS
      # run's stale github-pages artifacts from earlier attempts before
      # the fresh upload below (no-op on the first attempt).
      - name: Delete stale github-pages artifacts from earlier attempts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --paginate \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
            while IFS= read -r artifact_id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              echo "deleted stale github-pages artifact ${artifact_id}"
            done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v5
