name: test-unit

# Trigger on pull requests targeting master and on master pushes.
# The PR run gates the merge; the push run re-verifies the exact master
# commit that lands (squash merges and back-to-back merges can produce
# a master state no PR ever tested). Master is the staging area for the
# 'stable' release mirror — it must be green before a release is cut
# (scripts/release.sh checks exactly this run). A branch push with an
# open PR fires only `pull_request`, avoiding the classic double-run.
# A weekly schedule (Mon 03:07 UTC, issue #78) re-runs the suite on
# master even when nothing was pushed — runner image updates
# (ubuntu-latest) and environment drift can break a "green" master
# between releases. Scheduled runs always target the default branch.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '7 3 * * 1'  # Mondays 03:07 UTC (off-peak, off the hour)

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# read-only access to the repository is all this workflow needs.
permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push. Scheduled runs
# get their own group: a weekly run must never cancel an in-flight
# push/PR run of the same ref (a cancelled run on a master sha reads as
# red to scripts/release.sh's CI gate) — and conversely stays alive to
# deliver its drift verdict even when master moves under it.
concurrency:
  group: tests-${{ github.event_name == 'schedule' && 'weekly' || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version consistency
        run: make check-version
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Check contributor host tools
        run: sh tests/check-host.sh
      - name: Run ShellCheck lint
        run: make lint
      - name: Python syntax check
        run: make check-py
      - name: TSX syntax gate (tui/*.tsx, parse-only)
        # CI-only on purpose (issue #114): node/npm are not contributor-
        # host requirements (tests/check-host.sh), and a full type check
        # is impossible without opencode's plugin types — so this is a
        # pinned-tsc parse check with a wildcard shim. typescript comes
        # from a committed lockfile (npm ci, integrity-verified). The
        # wiring (run step + pin/lockfile sync) is guarded
        # by tests/unit/test-workflows.sh.
        run: sh tests/tsx-syntax-gate.sh
      - name: Run wrapper validation tests
        run: ./tests/unit/test-opencode-as-opencode.sh
      - name: Run JSONC parser edge-case tests
        run: ./tests/unit/test-jsonc-parser.sh
      - name: Run git-config toggle tests
        run: ./tests/unit/test-git-config.sh
      - name: Run container backend tests
        run: ./tests/unit/test-container-backend.sh
      - name: Run wrapper-bypass guard tests
        run: ./tests/unit/test-bypass-guard.sh
      - name: Run ddev-as-opencode tests
        run: ./tests/unit/test-ddev-as-opencode.sh
      - name: Run ddev database migration tests
        run: ./tests/unit/test-ddev-migrate.sh
      - name: Run Windows hosts bridge tests
        run: ./tests/unit/test-ddev-hosts.sh
      - name: Run mkcert CA reuse tests
        run: ./tests/unit/test-mkcert-reuse.sh
      - name: Run WSL2 /mnt/c exposure tests
        run: ./tests/unit/test-wsl-exposure.sh
      - name: Run UI helper tests
        run: ./tests/unit/test-ui.sh
      - name: Run docs link check
        run: ./tests/unit/test-docs.sh
      - name: Run CLI dispatcher tests
        run: ./tests/unit/test-kit-cli.sh
      - name: Run project path policy tests
        run: ./tests/unit/test-project-paths.sh
      - name: Run workflow consistency tests
        run: ./tests/unit/test-workflows.sh
      - name: Run install.sh arg-parsing tests
        run: ./tests/unit/test-install-args.sh
      - name: Run kit file list tests
        run: ./tests/unit/test-kit-files.sh ./tests/unit/test-tui-mode.sh
      - name: Run uninstall tests
        run: ./tests/unit/test-uninstall.sh
      - name: Run status tests
        run: ./tests/unit/test-status.sh
      - name: Run update flags tests
        run: ./tests/unit/test-update-flags.sh
      - name: Run release script tests
        run: ./tests/unit/test-release.sh
      - name: Run fs-baseline progress tests
        run: ./tests/unit/test-fs-baseline.sh
      - name: Run staged-write / handover gate tests
        run: ./tests/unit/test-staged-write.sh
      - name: Run sudoers pipeline tests
        run: ./tests/unit/test-sudoers-deploy.sh
      - name: Run secure binary tests
        run: ./tests/unit/test-secure-binary.sh
      - name: Run lib deploy manifest tests
        run: ./tests/unit/test-deploy-lib.sh
      - name: Run e2e binary source tests
        run: ./tests/unit/test-e2e-sources.sh
      - name: Run security advisory tests
        run: ./tests/unit/test-security-advisories.sh
      - name: Run audit log tests
        run: ./tests/unit/test-log.sh
      - name: Run browser bridge tests
        run: ./tests/unit/test-browser-bridge.sh
      - name: Run line-length ratchet
        run: ./tests/unit/test-line-length.sh
      - name: Run string-continuation guard
        run: ./tests/unit/test-string-continuations.sh
