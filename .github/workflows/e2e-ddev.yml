name: e2e-ddev

# Real-ddev e2e suite (tests/e2e/run-ddev.sh, docs/design/ddev-e2e-test.md).
# MANUAL-ONLY for now: the maintainer validates runtime + duration on a real
# runner first; a weekly schedule is the planned phase-3 follow-up (the
# golden-image cache is a local-workspace concept — CI rebuilds warm every
# run, see design doc §6 R6).
#
# Not part of the PR merge gate (e2e.yml keeps that job): this suite
# downloads GBs of images and runs a real ddev project lifecycle.
on:
  workflow_dispatch:
    inputs:
      site_tier:
        description: 'Also run the real-site tier (camino fixture, DD10-DD12)'
        required: false
        default: false
        type: boolean
      ddev_version:
        description: 'Pin a ddev version (e.g. v1.25.3); empty = latest release'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-ddev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ddev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode version
        id: version
        run: |
          echo "OC_VERSION=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 https://api.github.com/repos/anomalyco/opencode/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per version, shared with the other e2e jobs)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          key: opencode-e2e-latest${{ steps.version.outputs.OC_VERSION }}
          restore-keys: |
            opencode-e2e-latest-
      - name: Run real-ddev E2E test
        env:
          E2E_DDEV_SITE: ${{ inputs.site_tier == true && 'camino' || '' }}
          DDEV_VERSION: ${{ inputs.ddev_version }}
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/run-ddev.sh ./tests/e2e/lib.sh ./tests/check-host.sh ./tests/test-wrapper-validation.sh ./tests/test-jsonc-parser.sh ./tests/test-git-config.sh ./tests/test-container-backend.sh ./tests/test-bypass-guard.sh ./tests/test-ddev-as-opencode.sh ./tests/test-ddev-migrate.sh ./tests/test-ddev-hosts.sh ./tests/test-mkcert-reuse.sh ./tests/test-wsl-exposure.sh ./tests/test-ui.sh ./tests/test-docs.sh ./tests/test-kit-cli.sh ./tests/test-project-paths.sh ./tests/test-workflows.sh ./tests/test-install-args.sh ./tests/test-kit-files.sh ./tests/test-tui-mode.sh ./tests/test-uninstall.sh ./tests/test-status.sh ./tests/test-update-flags.sh ./tests/test-fs-baseline.sh \
            ./files/config.sh ./files/update.sh ./files/install.sh ./files/uninstall.sh ./files/status.sh \
            ./files/opencode-permissions-kit-lib/wrapper ./files/opencode-permissions-kit-lib/kit ./files/opencode-permissions-kit-lib/log.sh ./files/opencode-permissions-kit-lib/ui.sh ./files/opencode-permissions-kit-lib/shell-warn.sh ./files/opencode-permissions-kit-lib/setup-container-backend.sh ./files/opencode-permissions-kit-lib/bin/socket-check.sh ./files/opencode-permissions-kit-lib/bin/cwd-check.sh ./files/opencode-permissions-kit-lib/ddev-as-opencode.sh ./files/opencode-permissions-kit-lib/ddev-handover.sh ./files/opencode-permissions-kit-lib/ddev-migrate.sh ./files/opencode-permissions-kit-lib/ddev-hosts.sh ./files/opencode-permissions-kit-lib/fs-baseline.sh ./files/opencode-permissions-kit-lib/tui/kit-mode.tsx ./files/opencode-permissions-kit-lib/tui/opencode-danger.theme.json ./files/opencode-permissions-kit-lib/tui/tui.json ./files/opencode-permissions-kit-lib/tui/tui-danger.json ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
          ./tests/e2e/run-ddev.sh
      - name: Summary
        if: always()
        env:
          E2E_DDEV_SITE: ${{ inputs.site_tier == true && 'camino' || '' }}
          DDEV_VERSION: ${{ inputs.ddev_version }}
        run: |
          echo "### ddev-e2e (run-ddev.sh)" >> "$GITHUB_STEP_SUMMARY"
          echo "- site tier: ${E2E_DDEV_SITE:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ddev: ${DDEV_VERSION:-latest}" >> "$GITHUB_STEP_SUMMARY"
