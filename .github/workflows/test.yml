name: tests

# Trigger on push to master, pull requests targeting master, and manual
# runs. PRs run the suite before merge; pushes to master run it after. A
# branch push with an open PR fires only `pull_request` (no `push` filter
# for other branches), avoiding the classic double-run.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version consistency
        run: make check-version
      - name: Make scripts executable
        run: chmod +x ./tests/test-ui.sh ./tests/test-wrapper-validation.sh ./tests/test-jsonc-parser.sh ./tests/test-git-config.sh ./tests/test-container-backend.sh ./tests/test-bypass-guard.sh ./tests/test-migration.sh ./tests/test-ddev-as-opencode.sh ./tests/test-mkcert-reuse.sh ./tests/test-wsl-exposure.sh ./tests/test-docs.sh ./tests/test-kit-cli.sh ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/lib.sh ./files/config.sh ./files/update.sh ./files/install.sh ./files/uninstall.sh ./files/status.sh ./files/opencode-permissions-kit-lib/wrapper ./files/opencode-permissions-kit-lib/kit ./files/opencode-permissions-kit-lib/log.sh ./files/opencode-permissions-kit-lib/ui.sh ./files/opencode-permissions-kit-lib/shell-warn.sh ./files/opencode-permissions-kit-lib/setup-container-backend.sh ./files/opencode-permissions-kit-lib/migrate-denies.sh ./files/opencode-permissions-kit-lib/bin/socket-check.sh ./files/opencode-permissions-kit-lib/ddev-as-opencode.sh ./files/opencode-permissions-kit-lib/ddev-handover.sh ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
      - name: Run wrapper validation tests
        run: ./tests/test-wrapper-validation.sh
      - name: Run JSONC parser edge-case tests
        run: ./tests/test-jsonc-parser.sh
      - name: Run git-config toggle tests
        run: ./tests/test-git-config.sh
      - name: Run container backend tests
        run: ./tests/test-container-backend.sh
      - name: Run wrapper-bypass guard tests
        run: ./tests/test-bypass-guard.sh
      - name: Run hard-deny migration tests
        run: ./tests/test-migration.sh
      - name: Run ddev-as-opencode tests
        run: ./tests/test-ddev-as-opencode.sh
      - name: Run mkcert CA reuse tests
        run: ./tests/test-mkcert-reuse.sh
      - name: Run WSL2 /mnt/c exposure tests
        run: ./tests/test-wsl-exposure.sh
      - name: Run UI helper tests
        run: ./tests/test-ui.sh
      - name: Run docs link check
        run: ./tests/test-docs.sh
      - name: Run CLI dispatcher tests
        run: ./tests/test-kit-cli.sh
