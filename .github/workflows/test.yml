name: tests

# Trigger on pull requests targeting master and manual runs. The PR run
# is the merge gate — master only ever receives merged PR commits, so no
# post-merge push run is needed (deliberately removed to avoid the
# double-run after merging). A branch push with an open PR fires only
# `pull_request`, avoiding the classic double-run.
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# read-only access to the repository is all this workflow needs.
permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version consistency
        run: make check-version
      - name: Make scripts executable
        run: chmod +x ./tests/test-ui.sh ./tests/test-wrapper-validation.sh ./tests/test-jsonc-parser.sh ./tests/test-git-config.sh ./tests/test-container-backend.sh ./tests/test-bypass-guard.sh ./tests/test-ddev-as-opencode.sh ./tests/test-ddev-migrate.sh ./tests/test-ddev-hosts.sh ./tests/test-mkcert-reuse.sh ./tests/test-wsl-exposure.sh ./tests/test-docs.sh ./tests/test-kit-cli.sh ./tests/test-project-paths.sh ./tests/test-workflows.sh ./tests/test-install-args.sh ./tests/test-kit-files.sh ./tests/test-tui-mode.sh ./tests/test-uninstall.sh ./tests/test-status.sh ./tests/test-update-flags.sh ./tests/test-fs-baseline.sh ./tests/check-host.sh ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/run-ddev.sh ./tests/e2e/lib.sh ./files/config.sh ./files/update.sh ./files/install.sh ./files/uninstall.sh ./files/status.sh ./files/opencode-permissions-kit-lib/wrapper ./files/opencode-permissions-kit-lib/kit ./files/opencode-permissions-kit-lib/log.sh ./files/opencode-permissions-kit-lib/ui.sh ./files/opencode-permissions-kit-lib/shell-warn.sh ./files/opencode-permissions-kit-lib/setup-container-backend.sh ./files/opencode-permissions-kit-lib/bin/socket-check.sh ./files/opencode-permissions-kit-lib/ddev-as-opencode.sh ./files/opencode-permissions-kit-lib/ddev-handover.sh ./files/opencode-permissions-kit-lib/ddev-migrate.sh ./files/opencode-permissions-kit-lib/ddev-hosts.sh ./files/opencode-permissions-kit-lib/fs-baseline.sh ./files/opencode-permissions-kit-lib/tui/kit-mode.tsx ./files/opencode-permissions-kit-lib/tui/opencode-danger.theme.json ./files/opencode-permissions-kit-lib/tui/tui.json ./files/opencode-permissions-kit-lib/tui/tui-danger.json ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Check contributor host tools
        run: sh tests/check-host.sh
      - name: Run ShellCheck lint
        run: make lint
      - name: Run wrapper validation tests
        run: ./tests/test-wrapper-validation.sh
      - name: Run JSONC parser edge-case tests
        run: ./tests/test-jsonc-parser.sh
      - name: Run git-config toggle tests
        run: ./tests/test-git-config.sh
      - name: Run container backend tests
        run: ./tests/test-container-backend.sh
      - name: Run wrapper-bypass guard tests
        run: ./tests/test-bypass-guard.sh
      - name: Run ddev-as-opencode tests
        run: ./tests/test-ddev-as-opencode.sh
      - name: Run ddev database migration tests
        run: ./tests/test-ddev-migrate.sh
      - name: Run Windows hosts bridge tests
        run: ./tests/test-ddev-hosts.sh
      - name: Run mkcert CA reuse tests
        run: ./tests/test-mkcert-reuse.sh
      - name: Run WSL2 /mnt/c exposure tests
        run: ./tests/test-wsl-exposure.sh
      - name: Run UI helper tests
        run: ./tests/test-ui.sh
      - name: Run docs link check
        run: ./tests/test-docs.sh
      - name: Run CLI dispatcher tests
        run: ./tests/test-kit-cli.sh
      - name: Run project path policy tests
        run: ./tests/test-project-paths.sh
      - name: Run workflow consistency tests
        run: ./tests/test-workflows.sh
      - name: Run install.sh arg-parsing tests
        run: ./tests/test-install-args.sh
      - name: Run kit file list tests
        run: ./tests/test-kit-files.sh ./tests/test-tui-mode.sh
      - name: Run uninstall tests
        run: ./tests/test-uninstall.sh
      - name: Run status tests
        run: ./tests/test-status.sh
      - name: Run fs-baseline progress tests
        run: ./tests/test-fs-baseline.sh
