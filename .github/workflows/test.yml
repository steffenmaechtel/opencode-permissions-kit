name: tests

# Trigger only once on push to master (plus manual). Avoids the classic
# double-run: a push to a branch with an open PR fires both `push` and
# `pull_request`, and a tag push fires `push` again.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version consistency
        run: make check-version
      - name: Make scripts executable
        run: chmod +x ./tests/test-wrapper-validation.sh ./tests/test-jsonc-parser.sh ./tests/test-git-config.sh ./tests/test-container-backend.sh ./tests/test-bypass-guard.sh ./tests/test-migration.sh ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/lib.sh ./files/config.sh ./files/update.sh ./files/install.sh ./files/uninstall.sh ./files/status.sh ./files/opencode-permissions-kit-lib/wrapper ./files/opencode-permissions-kit-lib/log.sh ./files/opencode-permissions-kit-lib/shell-warn.sh ./files/opencode-permissions-kit-lib/setup-container-backend.sh ./files/opencode-permissions-kit-lib/migrate-denies.sh ./files/opencode-permissions-kit-lib/bin/socket-check.sh
      - name: Run wrapper validation tests
        run: ./tests/test-wrapper-validation.sh
      - name: Run JSONC parser edge-case tests
        run: ./tests/test-jsonc-parser.sh
      - name: Run git-config toggle tests
        run: ./tests/test-git-config.sh
      - name: Run container backend tests
        run: ./tests/test-container-backend.sh
      - name: Run wrapper-bypass guard tests
        run: ./tests/test-bypass-guard.sh
      - name: Run hard-deny migration tests
        run: ./tests/test-migration.sh
