name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make scripts executable
        run: chmod +x ./tests/test-wrapper-validation.sh ./tests/test-project-config.sh
      - name: Run wrapper validation tests
        run: ./tests/test-wrapper-validation.sh
      - name: Run project config tests
        run: ./tests/test-project-config.sh
