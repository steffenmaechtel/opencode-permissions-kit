name: tests

# Trigger on pull requests targeting master and manual runs. The PR run
# is the merge gate — master only ever receives merged PR commits, so no
# post-merge push run is needed (deliberately removed to avoid the
# double-run after merging). A branch push with an open PR fires only
# `pull_request`, avoiding the classic double-run.
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# read-only access to the repository is all this workflow needs.
permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version consistency
        run: make check-version
      - name: Make scripts executable
        run: chmod +x ./tests/unit/test-ui.sh ./tests/unit/test-opencode-as-opencode.sh ./tests/unit/test-jsonc-parser.sh ./tests/unit/test-git-config.sh ./tests/unit/test-container-backend.sh ./tests/unit/test-bypass-guard.sh ./tests/unit/test-ddev-as-opencode.sh ./tests/unit/test-ddev-migrate.sh ./tests/unit/test-ddev-hosts.sh ./tests/unit/test-mkcert-reuse.sh ./tests/unit/test-wsl-exposure.sh ./tests/unit/test-docs.sh ./tests/unit/test-kit-cli.sh ./tests/unit/test-project-paths.sh ./tests/unit/test-workflows.sh ./tests/unit/test-install-args.sh ./tests/unit/test-kit-files.sh ./tests/unit/test-tui-mode.sh ./tests/unit/test-uninstall.sh ./tests/unit/test-status.sh ./tests/unit/test-update-flags.sh ./tests/unit/test-release.sh ./tests/unit/test-fs-baseline.sh ./scripts/release.sh ./tests/check-host.sh ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/run-ddev.sh ./tests/e2e/lib.sh ./files/install.sh ./files/etc/umask.sh ./files/opencode-permissions-kit-lib/management/config.sh ./files/opencode-permissions-kit-lib/management/update.sh ./files/opencode-permissions-kit-lib/management/uninstall.sh ./files/opencode-permissions-kit-lib/management/status.sh ./files/opencode-permissions-kit-lib/bin/opencode-as-opencode ./files/opencode-permissions-kit-lib/bin/opk ./files/opencode-permissions-kit-lib/sh/log.sh ./files/opencode-permissions-kit-lib/sh/ui.sh ./files/opencode-permissions-kit-lib/sh/shell-warn.sh ./files/opencode-permissions-kit-lib/bin/setup-container-backend ./files/opencode-permissions-kit-lib/bin/socket-check ./files/opencode-permissions-kit-lib/bin/cwd-check ./files/opencode-permissions-kit-lib/sh/ddev-terminal.sh ./files/opencode-permissions-kit-lib/sh/ddev-handover.sh ./files/opencode-permissions-kit-lib/sh/ddev-migrate.sh ./files/opencode-permissions-kit-lib/bin/ddev-migrate ./files/opencode-permissions-kit-lib/sh/ddev-hosts.sh ./files/opencode-permissions-kit-lib/sh/fs-baseline.sh ./files/opencode-permissions-kit-lib/tui/kit-mode.tsx ./files/opencode-permissions-kit-lib/tui/opencode-danger.theme.json ./files/opencode-permissions-kit-lib/tui/tui.json ./files/opencode-permissions-kit-lib/tui/tui-danger.json ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Check contributor host tools
        run: sh tests/check-host.sh
      - name: Run ShellCheck lint
        run: make lint
      - name: Run wrapper validation tests
        run: ./tests/unit/test-opencode-as-opencode.sh
      - name: Run JSONC parser edge-case tests
        run: ./tests/unit/test-jsonc-parser.sh
      - name: Run git-config toggle tests
        run: ./tests/unit/test-git-config.sh
      - name: Run container backend tests
        run: ./tests/unit/test-container-backend.sh
      - name: Run wrapper-bypass guard tests
        run: ./tests/unit/test-bypass-guard.sh
      - name: Run ddev-as-opencode tests
        run: ./tests/unit/test-ddev-as-opencode.sh
      - name: Run ddev database migration tests
        run: ./tests/unit/test-ddev-migrate.sh
      - name: Run Windows hosts bridge tests
        run: ./tests/unit/test-ddev-hosts.sh
      - name: Run mkcert CA reuse tests
        run: ./tests/unit/test-mkcert-reuse.sh
      - name: Run WSL2 /mnt/c exposure tests
        run: ./tests/unit/test-wsl-exposure.sh
      - name: Run UI helper tests
        run: ./tests/unit/test-ui.sh
      - name: Run docs link check
        run: ./tests/unit/test-docs.sh
      - name: Run CLI dispatcher tests
        run: ./tests/unit/test-kit-cli.sh
      - name: Run project path policy tests
        run: ./tests/unit/test-project-paths.sh
      - name: Run workflow consistency tests
        run: ./tests/unit/test-workflows.sh
      - name: Run install.sh arg-parsing tests
        run: ./tests/unit/test-install-args.sh
      - name: Run kit file list tests
        run: ./tests/unit/test-kit-files.sh ./tests/unit/test-tui-mode.sh
      - name: Run uninstall tests
        run: ./tests/unit/test-uninstall.sh
      - name: Run status tests
        run: ./tests/unit/test-status.sh
      - name: Run fs-baseline progress tests
        run: ./tests/unit/test-fs-baseline.sh
