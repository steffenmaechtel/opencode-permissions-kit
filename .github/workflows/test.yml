name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version consistency
        run: make check-version
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install deps
        run: npm install
      - name: Make scripts executable
        run: chmod +x ./tests/test-wrapper-validation.sh ./tests/test-project-config.sh ./tests/test-hooks.sh ./tests/test-jsonc-parser.sh ./tests/test-git-config.sh ./files/opencode-lib/hooks/post-checkout ./files/opencode-lib/hooks/post-merge ./files/opencode-lib/hooks/post-commit ./files/config.sh ./files/update.sh ./files/install.sh ./files/uninstall.sh ./files/opencode-lib/protect-projects.sh ./files/opencode-lib/wrapper
      - name: Run wrapper validation tests
        run: ./tests/test-wrapper-validation.sh
      - name: Run project config tests
        run: ./tests/test-project-config.sh
      - name: Run git hook regression tests
        run: ./tests/test-hooks.sh
      - name: Run JSONC parser edge-case tests
        run: ./tests/test-jsonc-parser.sh
      - name: Run git-config toggle tests
        run: ./tests/test-git-config.sh
      - name: Run plugin TS unit tests
        run: npx vitest run tests/plugin/index.test.ts
