name: test-e2e

# Runs on manual dispatch, pull requests targeting master, and master
# pushes. PRs get the e2e verdict before merge; the push run re-verifies
# the exact master commit that lands (squash merges and back-to-back
# merges can produce a master state no PR ever tested). Master is the
# staging area for the 'stable' release mirror — it must be green before
# a release is cut (scripts/release.sh checks exactly this run). A
# branch push with an open PR fires only `pull_request` — no double-run.
# A weekly schedule (Mon 03:17 UTC, issue #78) re-runs both suites on
# master even when nothing was pushed: the suites resolve the LATEST
# opencode release at runtime, so a new opencode version can break a
# "green" master between pushes — the cron catches that drift before a
# release is cut. Scheduled runs use the defaults (E2E_STRICT=0, like
# push runs; the strict input only applies to manual dispatch).
#
# Lane naming is major-explicit (lane-naming wave 2026-10-23): every
# e2e job name carries its opencode major, so no name ever silently
# changes meaning at a flip. The e2e-2x-* / e2e-rootless-2x jobs run
# the suites against the CURRENT opencode 2.x release (issue #197): all
# real installations run 2.x, and 2.x ships via the npm registry, not
# GitHub releases (releases/latest stays 1.x), so these jobs resolve
# the npm dist-tag 'latest' at run time and fail the job loudly when
# that tag ever leaves 2.* — the upstream flip the kit must react to
# (internal/records/opencode-2x.md). The e2e-1x / e2e-rootless-1x
# twins keep 1.x an explicit lane while the kit still ships 1.x support
# (OPENCODE_MAJOR gating, v1 config shapes): they resolve GitHub
# releases/latest and fail loudly when that resolution leaves 1.* — the
# mirror image of the 2.x flip signal. Same triggers and skip rule for
# all lanes (non-e2e-input changes skip, see the path-filtering
# paragraph): PRs get the verdict before merge, master pushes re-verify
# it before a release is cut, and the weekly run catches release drift
# between pushes.
#
# The git dimension is explicit where it varies, implicit by convention
# elsewhere: no git suffix = git-distro (the pinned ubuntu:24.04 apt
# git). Only the core e2e-2x suite carries the git pair (issue #118,
# motivated by the git >= 2.55-only #116 fatal): e2e-2x-git-distro
# keeps the Ubuntu 24.04 apt git (2.43, the floor near the documented
# oldest baselines), e2e-2x-git-latest builds the image with the
# current git-core PPA git, resolved at BUILD time so the weekly cron
# catches new-git drift. The pair are two explicit jobs, not a matrix:
# each leg then reports under its own stable name (required checks
# match names), and a job-level skip cannot collapse them. Cross-
# producting the other lanes would double CI for near-zero signal —
# the kit's own git surface is tiny (`git -C <dir> config --global`,
# safe.directory).
#
# Path filtering (non-e2e-input changes skip): push and PR runs first
# detect what changed (dorny/paths-filter) — the 'code' set is the e2e
# INPUTS only: files/** (the kit under test), tests/e2e/** (the suite
# itself), .github/** (the workflows), Makefile (invocation), VERSION
# (release pins). The suites source NOTHING from scripts/ or the
# non-e2e test trees (tests/unit, tests/ux, top-level tests/fixtures,
# check-host.sh, tsx-syntax-gate.sh) — those feed the UNFILTERED unit
# workflow — so dev-tooling and unit-test waves no longer burn the e2e
# runners. Safety of the narrowing: wiring anything from scripts/ or a
# new tests/ tree INTO the suite necessarily touches tests/e2e/** or
# the Makefile (both trigger), and the weekly cron plus the pre-release
# review pass backstop the rest. When NOTHING in the code set changed,
# the suites skip. All jobs skip at job level (the run still EXISTS for
# its sha with a green 'skipped' conclusion, so scripts/release.sh's
# gate — which accepts skipped but not absent runs — stays satisfied
# even on a non-code master push; every job reports under its own
# stable name, which is exactly why the git pair are two explicit jobs
# and not a matrix — a job-level `if` on a matrix collapses the legs
# into one bare skipped check that never reports under the expanded
# leg names branch protection requires).
# Schedule and manual dispatch always run (drift checks / explicit
# human intent). test-unit.yml is NOT filtered: test-docs.sh validates
# links across docs/ + the root Markdown files, so docs changes are
# unit-test-relevant.
on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Strict mode: skips count as failures (verifies the rootless sections really run on this runner)'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '17 3 * * 1'  # Mondays 03:17 UTC (after test-unit's verdict)

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# read-only access is enough (checkout + cache only — no artifacts,
# no PR comments).
permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push. Scheduled runs
# get their own group: a weekly run must never cancel an in-flight
# push/PR run of the same ref (a cancelled run on a master sha reads as
# red to scripts/release.sh's CI gate) — and conversely stays alive to
# deliver its drift verdict even when master moves under it.
concurrency:
  group: >-
    e2e-${{ github.event_name == 'schedule' && 'weekly'
    || (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref
    || 'manual' }}
  cancel-in-progress: true

jobs:
  # Changed-path detection for the skip logic (header comment above).
  # 'code' is true when any e2e INPUT changed (files/ kit, the suite
  # itself, the workflows, the invocation, the version).
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'files/**'
              - 'tests/e2e/**'
              - '.github/**'
              - 'Makefile'
              - 'VERSION'

  # Core setuid-docker suite, opencode 2.x lane, git-distro (the pinned
  # ubuntu:24.04 apt git — 'no git suffix = git-distro' everywhere
  # else; this half of the git pair names it explicitly, issue #118).
  # The deterministic end of the git version range: 2.43, near the
  # documented oldest baselines (Debian 12: 2.30, Ubuntu 22.04: 2.34).
  e2e-2x-git-distro:
    needs: changes
    # non-code changes skip; schedule/dispatch always run (see header)
    if: >-
      ${{ github.event_name != 'push' && github.event_name != 'pull_request'
      || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve current opencode 2.x (npm dist-tag latest)
        id: version2x
        # Default lane = 2.x since the issue #197 flip (what the
        # installations run; releases/latest stays 1.x). Anchored
        # validation before the value reaches GITHUB_OUTPUT or the cache
        # key — the packument is npm-registry-derived (untrusted); a bare
        # "2.*" prefix gate would let shell metacharacters through.
        run: |
          OC2="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
              https://registry.npmjs.org/@opencode/cli-linux-x64/latest \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' \
              2>/dev/null || true)"
          if printf '%s' "$OC2" | grep -qE '^2\.[0-9]+(\.[0-9]+)*$'; then
            echo "OC2_VERSION=$OC2" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm dist-tag latest is '${OC2:-unresolved}', expected a 2.x semver \
                (upstream flip? internal/records/opencode-2x.md)" && exit 1
          fi
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^E2E_OLD_VERSION="${E2E_OLD_VERSION:-\([0-9.]*\)}".*/\1/p' \
              tests/e2e/lib.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per 2.x version)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          # Exact key for the (OLD, npm-latest) combo. The key scheme was
          # the 2x twins' until the issue #197 flip — the default lane
          # adopted it byte-identical, so the warm caches carried over;
          # the v1-era restore prefix below still warm-starts the OLD
          # binary + installer from pre-flip default runs. Shared with
          # the git-latest twin (the image build differs, the cached
          # opencode binaries do not).
          key: opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-npm${{ steps.version2x.outputs.OC2_VERSION }}
          restore-keys: |
            opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run E2E test
        run: |
          ./tests/e2e/run.sh
        env:
          # Git channel explicit in both halves of the pair (convention:
          # no suffix = git-distro) — travels via env into lib.sh's
          # --build-arg GIT_CHANNEL.
          E2E_GIT_CHANNEL: distro
          # Base image via the Google Docker Hub mirror: auth.docker.io
          # 504s (2026-10) killed every suite at metadata resolve.
          E2E_BASE_IMAGE: mirror.gcr.io/library/ubuntu:24.04

  # Core setuid-docker suite, opencode 2.x lane, git-latest — the
  # floating half of the git pair (issue #118): builds the image with
  # the current git-core PPA git, resolved at BUILD time, so the weekly
  # cron catches new-git drift (the #116 unreadable-CWD fatal only
  # existed on git >= 2.55; a distro-only suite can never see that
  # class). run.sh asserts the PPA git landed. Shares the binary cache
  # with the distro twin.
  e2e-2x-git-latest:
    needs: changes
    # non-code changes skip; schedule/dispatch always run (see header)
    if: >-
      ${{ github.event_name != 'push' && github.event_name != 'pull_request'
      || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve current opencode 2.x (npm dist-tag latest)
        id: version2x
        # Default lane = 2.x since the issue #197 flip (what the
        # installations run; releases/latest stays 1.x). Anchored
        # validation before the value reaches GITHUB_OUTPUT or the cache
        # key — the packument is npm-registry-derived (untrusted); a bare
        # "2.*" prefix gate would let shell metacharacters through.
        run: |
          OC2="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
              https://registry.npmjs.org/@opencode/cli-linux-x64/latest \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' \
              2>/dev/null || true)"
          if printf '%s' "$OC2" | grep -qE '^2\.[0-9]+(\.[0-9]+)*$'; then
            echo "OC2_VERSION=$OC2" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm dist-tag latest is '${OC2:-unresolved}', expected a 2.x semver \
                (upstream flip? internal/records/opencode-2x.md)" && exit 1
          fi
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^E2E_OLD_VERSION="${E2E_OLD_VERSION:-\([0-9.]*\)}".*/\1/p' \
              tests/e2e/lib.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per 2.x version)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          # Exact key for the (OLD, npm-latest) combo. The key scheme was
          # the 2x twins' until the issue #197 flip — the default lane
          # adopted it byte-identical, so the warm caches carried over;
          # the v1-era restore prefix below still warm-starts the OLD
          # binary + installer from pre-flip default runs. Shared with
          # the distro twin (the image build differs, the cached
          # opencode binaries do not).
          key: opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-npm${{ steps.version2x.outputs.OC2_VERSION }}
          restore-keys: |
            opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run E2E test
        run: |
          ./tests/e2e/run.sh
        env:
          # PPA leg of the git pair (issue #118) — travels via env into
          # lib.sh's --build-arg GIT_CHANNEL; run.sh asserts the PPA git
          # landed.
          E2E_GIT_CHANNEL: latest
          # Base image via the Google Docker Hub mirror: auth.docker.io
          # 504s (2026-10) killed every suite at metadata resolve.
          E2E_BASE_IMAGE: mirror.gcr.io/library/ubuntu:24.04

  # docker-rootless daemon e2e (Phase 3). Same triggers + shared binary cache;
  # needs systemd-in-container + nested user namespaces, and SKIPs wholesale
  # when the runner cannot provide them (see run-docker-rootless.sh).
  e2e-rootless-2x:
    needs: changes
    # non-code changes skip; schedule/dispatch always run (see header)
    if: >-
      ${{ github.event_name != 'push' && github.event_name != 'pull_request'
      || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve current opencode 2.x (npm dist-tag latest)
        id: version2x
        # Default lane = 2.x since the issue #197 flip; anchored-validated
        # like the e2e-2x jobs above — a bad resolution fails the step loudly,
        # never a silently degraded cache key (0.0.45c C8 contract).
        run: |
          OC2="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
              https://registry.npmjs.org/@opencode/cli-linux-x64/latest \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' \
              2>/dev/null || true)"
          if printf '%s' "$OC2" | grep -qE '^2\.[0-9]+(\.[0-9]+)*$'; then
            echo "OC2_VERSION=$OC2" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm dist-tag latest is '${OC2:-unresolved}', expected a 2.x semver \
                (upstream flip? internal/records/opencode-2x.md)" && exit 1
          fi
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^E2E_OLD_VERSION="${E2E_OLD_VERSION:-\([0-9.]*\)}".*/\1/p' \
              tests/e2e/lib.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per 2.x version, shared with e2e job)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          # Same key scheme as the e2e job (the former 2x-twin keys, warm
          # across the issue #197 flip); parallel saves of the same key
          # are best-effort, one simply wins.
          key: opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-npm${{ steps.version2x.outputs.OC2_VERSION }}
          restore-keys: |
            opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run docker-rootless E2E test
        run: |
          E2E_STRICT="${{ inputs.strict == true && '1' || '0' }}" ./tests/e2e/run-docker-rootless.sh
        env:
          # Base image via the Google Docker Hub mirror: auth.docker.io
          # 504s (2026-10) killed every suite at metadata resolve.
          E2E_BASE_IMAGE: mirror.gcr.io/library/ubuntu:24.04

  # opencode 1.x lane (issue #197): the same suite against the CURRENT
  # 1.x release, resolved from GitHub releases/latest at run time — the
  # explicit legacy-major lane while the kit still ships 1.x support
  # (OPENCODE_MAJOR gating, v1 config shapes). A resolution outside 1.*
  # fails the job loudly: when GitHub flips releases/latest to 2.x, this
  # lane's premise is gone and the kit must drop it (the mirror image of
  # the default lane's 2.x flip signal, internal/records/opencode-2x.md).
  # Same triggers + code-filter skip as the 2x lanes. The exact cache
  # key is the v1-era default scheme (warm from all pre-flip default
  # runs); the 2x-lane restore prefix warm-starts the OLD binary and
  # installer from the post-flip default caches.
  e2e-1x:
    needs: changes
    # non-code changes skip; schedule/dispatch always run (see header)
    if: >-
      ${{ github.event_name != 'push' && github.event_name != 'pull_request'
      || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode 1.x (GitHub releases/latest)
        id: version
        # 0.0.45c C8 contract kept through the issue #197 flip:
        # authenticated (the ephemeral token — an anonymous 403 from a
        # shared runner IP used to go green with an empty OC_VERSION and
        # a degraded cache key) and anchored-validated, now against the
        # lane's expected major: a resolution failure fails THIS step
        # loudly instead of degrading the key.
        env:
          OPK_GH_TOKEN: ${{ github.token }}
        run: |
          OCV="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
              -H "Authorization: Bearer $OPK_GH_TOKEN" \
              https://api.github.com/repos/anomalyco/opencode/releases/latest \
              | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')"
          if printf '%s' "$OCV" | grep -qE '^1\.[0-9]+(\.[0-9]+)*$'; then
            echo "OC_VERSION=$OCV" >> "$GITHUB_OUTPUT"
          else
            echo "::error::opencode releases/latest resolved '${OCV:-unresolved}', expected a 1.x semver \
                (upstream flip? internal/records/opencode-2x.md)" && exit 1
          fi
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^E2E_OLD_VERSION="${E2E_OLD_VERSION:-\([0-9.]*\)}".*/\1/p' \
              tests/e2e/lib.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per 1.x version)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          # The v1-era default keys (opencode-e2e-old<OLD>-latest<ver>):
          # warm from every pre-flip default run; the 2x restore prefix
          # bridges to the post-flip default caches for the OLD binary.
          key: opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-latest${{ steps.version.outputs.OC_VERSION }}
          restore-keys: |
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
            opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run E2E test (opencode 1.x pin)
        run: |
          ./tests/e2e/run.sh
        env:
          # Resolved 1.x version travels via env, never interpolated into
          # the run: shell (S6: defense-in-depth on top of the anchored check).
          E2E_OC_VERSION: ${{ steps.version.outputs.OC_VERSION }}
          # Base image via the Google Docker Hub mirror: auth.docker.io
          # 504s (2026-10) killed every suite at metadata resolve.
          E2E_BASE_IMAGE: mirror.gcr.io/library/ubuntu:24.04

  # docker-rootless daemon e2e, opencode 1.x lane (issue #197) — the
  # same mirrored trigger/cache layout as its 2x twin above; see
  # e2e-1x for the GitHub resolution rationale and e2e-rootless-2x for
  # the skip semantics.
  e2e-rootless-1x:
    needs: changes
    # non-code changes skip; schedule/dispatch always run (see header)
    if: >-
      ${{ github.event_name != 'push' && github.event_name != 'pull_request'
      || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode 1.x (GitHub releases/latest)
        id: version
        # Same authenticated + anchored-validated contract as e2e-1x
        # (0.0.45c C8), gated on the lane's expected major.
        env:
          OPK_GH_TOKEN: ${{ github.token }}
        run: |
          OCV="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
              -H "Authorization: Bearer $OPK_GH_TOKEN" \
              https://api.github.com/repos/anomalyco/opencode/releases/latest \
              | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')"
          if printf '%s' "$OCV" | grep -qE '^1\.[0-9]+(\.[0-9]+)*$'; then
            echo "OC_VERSION=$OCV" >> "$GITHUB_OUTPUT"
          else
            echo "::error::opencode releases/latest resolved '${OCV:-unresolved}', expected a 1.x semver \
                (upstream flip? internal/records/opencode-2x.md)" && exit 1
          fi
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^E2E_OLD_VERSION="${E2E_OLD_VERSION:-\([0-9.]*\)}".*/\1/p' \
              tests/e2e/lib.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per 1.x version, shared with e2e-1x)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          # v1-era default scheme (see e2e-1x); parallel saves of the same
          # key are best-effort, one simply wins.
          key: opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-latest${{ steps.version.outputs.OC_VERSION }}
          restore-keys: |
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
            opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run docker-rootless E2E test (opencode 1.x pin)
        run: |
          E2E_STRICT="${{ inputs.strict == true && '1' || '0' }}" ./tests/e2e/run-docker-rootless.sh
        env:
          # Resolved 1.x version travels via env, never interpolated into
          # the run: shell (S6: defense-in-depth on top of the anchored check).
          E2E_OC_VERSION: ${{ steps.version.outputs.OC_VERSION }}
          # Base image via the Google Docker Hub mirror: auth.docker.io
          # 504s (2026-10) killed every suite at metadata resolve.
          E2E_BASE_IMAGE: mirror.gcr.io/library/ubuntu:24.04
