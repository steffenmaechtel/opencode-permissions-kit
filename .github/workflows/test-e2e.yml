name: test-e2e

# Runs on manual dispatch, pull requests targeting master, and master
# pushes. PRs get the e2e verdict before merge; the push run re-verifies
# the exact master commit that lands (squash merges and back-to-back
# merges can produce a master state no PR ever tested). Master is the
# staging area for the 'stable' release mirror — it must be green before
# a release is cut (scripts/release.sh checks exactly this run). A
# branch push with an open PR fires only `pull_request` — no double-run.
# A weekly schedule (Mon 03:17 UTC, issue #78) re-runs both suites on
# master even when nothing was pushed: the suites resolve the LATEST
# opencode release at runtime, so a new opencode version can break a
# "green" master between pushes — the cron catches that drift before a
# release is cut. Scheduled runs use the defaults (E2E_STRICT=0, like
# push runs; the strict input only applies to manual dispatch).
#
# The e2e-2x / e2e-rootless-2x jobs run the same suites a second time,
# pinned to the CURRENT opencode 2.x release (issue #80): 2.x ships via
# the npm registry, not GitHub releases (releases/latest stays 1.x), so
# these jobs resolve the npm dist-tag 'latest' at run time and fail the
# job loudly when that tag ever leaves 2.* — the upstream flip the kit
# must react to (docs/design/opencode-2x.md). Same triggers and
# docs-only skip as the v1 jobs: PRs get the 2.x verdict before merge,
# master pushes re-verify it before a release is cut, and the weekly
# run catches 2.x release drift between pushes.
#
# Path filtering (docs-only changes skip): push and PR runs first detect
# what changed (dorny/paths-filter) — when NOTHING outside docs/**,
# *.md, LICENSE and .gitignore changed, both jobs skip with a green
# 'skipped' conclusion (job-level on purpose: the run still EXISTS for
# its sha, so scripts/release.sh's gate — which accepts skipped but not
# absent runs — stays satisfied even on a docs-only master push).
# Schedule and manual dispatch always run (drift checks / explicit
# human intent). test-unit.yml is NOT filtered: test-docs.sh validates
# links across docs/ + the root Markdown files, so docs changes are
# unit-test-relevant.
on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Strict mode: skips count as failures (verifies the rootless sections really run on this runner)'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '17 3 * * 1'  # Mondays 03:17 UTC (after test-unit's verdict)

# Least-privilege token (CodeQL actions/missing-workflow-permissions):
# read-only access is enough (checkout + cache only — no artifacts,
# no PR comments).
permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push. Scheduled runs
# get their own group: a weekly run must never cancel an in-flight
# push/PR run of the same ref (a cancelled run on a master sha reads as
# red to scripts/release.sh's CI gate) — and conversely stays alive to
# deliver its drift verdict even when master moves under it.
concurrency:
  group: e2e-${{ github.event_name == 'schedule' && 'weekly' || github.ref }}
  cancel-in-progress: true

jobs:
  # Changed-path detection for the skip logic (header comment above).
  # 'code' is true when anything outside the docs-only set changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'files/**'
              - 'tests/**'
              - 'scripts/**'
              - '.github/**'
              - 'Makefile'
              - 'VERSION'

  e2e:
    needs: changes
    # docs-only changes skip; schedule/dispatch always run (see header)
    if: ${{ github.event_name != 'push' && github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode version
        id: version
        run: |
          echo "OC_VERSION=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 https://api.github.com/repos/anomalyco/opencode/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^OLD_VERSION="\([0-9.]*\)".*/\1/p' tests/e2e/run.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per version)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          # Exact key for the (OLD, latest) combo. When the latest opencode
          # bumps, restore-keys below reuses the previous cache (same OLD +
          # installer), so run.sh only re-downloads the one new binary.
          key: opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-latest${{ steps.version.outputs.OC_VERSION }}
          restore-keys: |
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run E2E test
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/run-ddev.sh ./tests/e2e/lib.sh ./scripts/release.sh ./tests/check-host.sh ./tests/unit/test-opencode-as-opencode.sh ./tests/unit/test-jsonc-parser.sh ./tests/unit/test-git-config.sh ./tests/unit/test-container-backend.sh ./tests/unit/test-bypass-guard.sh ./tests/unit/test-ddev-as-opencode.sh ./tests/unit/test-ddev-migrate.sh ./tests/unit/test-ddev-hosts.sh ./tests/unit/test-mkcert-reuse.sh ./tests/unit/test-wsl-exposure.sh ./tests/unit/test-ui.sh ./tests/unit/test-docs.sh ./tests/unit/test-kit-cli.sh ./tests/unit/test-project-paths.sh ./tests/unit/test-workflows.sh ./tests/unit/test-install-args.sh ./tests/unit/test-kit-files.sh ./tests/unit/test-tui-mode.sh ./tests/unit/test-uninstall.sh ./tests/unit/test-status.sh ./tests/unit/test-update-flags.sh ./tests/unit/test-release.sh ./tests/unit/test-fs-baseline.sh ./tests/unit/test-browser-bridge.sh ./tests/unit/test-e2e-sources.sh \
            ./files/install.sh ./files/etc/umask.sh ./files/opencode-permissions-kit-lib/management/config.sh ./files/opencode-permissions-kit-lib/management/update.sh ./files/opencode-permissions-kit-lib/management/uninstall.sh ./files/opencode-permissions-kit-lib/management/status.sh ./files/opencode-permissions-kit-lib/bin/opencode-as-opencode ./files/opencode-permissions-kit-lib/bin/opk ./files/opencode-permissions-kit-lib/sh/log.sh ./files/opencode-permissions-kit-lib/sh/ui.sh ./files/opencode-permissions-kit-lib/sh/shell-warn.sh ./files/opencode-permissions-kit-lib/bin/setup-container-backend ./files/opencode-permissions-kit-lib/bin/socket-check ./files/opencode-permissions-kit-lib/bin/cwd-check ./files/opencode-permissions-kit-lib/sh/ddev-terminal.sh ./files/opencode-permissions-kit-lib/sh/ddev-handover.sh ./files/opencode-permissions-kit-lib/sh/ddev-migrate.sh ./files/opencode-permissions-kit-lib/bin/ddev-migrate ./files/opencode-permissions-kit-lib/sh/ddev-hosts.sh ./files/opencode-permissions-kit-lib/sh/fs-baseline.sh ./files/opencode-permissions-kit-lib/sh/wsl-browser-bridge.sh ./files/opencode-permissions-kit-lib/bin/browser-bridge ./files/opencode-permissions-kit-lib/tui/kit-mode.tsx ./files/opencode-permissions-kit-lib/tui/kit-mode-2x.tsx ./files/opencode-permissions-kit-lib/tui/opencode-danger.theme.json ./files/opencode-permissions-kit-lib/tui/tui.json ./files/opencode-permissions-kit-lib/tui/tui-danger.json ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
          ./tests/e2e/run.sh
        env:
          # Authorize api.github.com calls (rate-limit resilience, lib.sh
          # gh_latest_tag) — the ephemeral workflow token, no secret needed.
          OPK_GH_TOKEN: ${{ github.token }}

  # docker-rootless daemon e2e (Phase 3). Same triggers + shared binary cache;
  # needs systemd-in-container + nested user namespaces, and SKIPs wholesale
  # when the runner cannot provide them (see run-docker-rootless.sh).
  e2e-rootless:
    needs: changes
    # docs-only changes skip; schedule/dispatch always run (see header)
    if: ${{ github.event_name != 'push' && github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode version
        id: version
        run: |
          echo "OC_VERSION=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 https://api.github.com/repos/anomalyco/opencode/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^OLD_VERSION="\([0-9.]*\)".*/\1/p' tests/e2e/run.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per version, shared with e2e job)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          key: opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-latest${{ steps.version.outputs.OC_VERSION }}
          restore-keys: |
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run docker-rootless E2E test
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/run-ddev.sh ./tests/e2e/lib.sh ./scripts/release.sh ./tests/check-host.sh ./tests/unit/test-update-flags.sh ./tests/unit/test-release.sh \
            ./tests/unit/test-opencode-as-opencode.sh ./tests/unit/test-jsonc-parser.sh ./tests/unit/test-git-config.sh ./tests/unit/test-container-backend.sh ./tests/unit/test-bypass-guard.sh ./tests/unit/test-ddev-as-opencode.sh ./tests/unit/test-ddev-migrate.sh ./tests/unit/test-ddev-hosts.sh ./tests/unit/test-mkcert-reuse.sh ./tests/unit/test-wsl-exposure.sh ./tests/unit/test-ui.sh ./tests/unit/test-docs.sh ./tests/unit/test-kit-cli.sh ./tests/unit/test-project-paths.sh ./tests/unit/test-workflows.sh ./tests/unit/test-install-args.sh ./tests/unit/test-kit-files.sh ./tests/unit/test-tui-mode.sh ./tests/unit/test-uninstall.sh ./tests/unit/test-status.sh ./tests/unit/test-fs-baseline.sh ./tests/unit/test-browser-bridge.sh ./tests/unit/test-e2e-sources.sh \
            ./files/install.sh ./files/etc/umask.sh ./files/opencode-permissions-kit-lib/management/config.sh ./files/opencode-permissions-kit-lib/management/update.sh ./files/opencode-permissions-kit-lib/management/uninstall.sh ./files/opencode-permissions-kit-lib/management/status.sh ./files/opencode-permissions-kit-lib/bin/opencode-as-opencode ./files/opencode-permissions-kit-lib/bin/opk ./files/opencode-permissions-kit-lib/sh/log.sh ./files/opencode-permissions-kit-lib/sh/ui.sh ./files/opencode-permissions-kit-lib/sh/shell-warn.sh ./files/opencode-permissions-kit-lib/bin/setup-container-backend ./files/opencode-permissions-kit-lib/bin/socket-check ./files/opencode-permissions-kit-lib/bin/cwd-check ./files/opencode-permissions-kit-lib/sh/ddev-terminal.sh ./files/opencode-permissions-kit-lib/sh/ddev-handover.sh ./files/opencode-permissions-kit-lib/sh/ddev-migrate.sh ./files/opencode-permissions-kit-lib/bin/ddev-migrate ./files/opencode-permissions-kit-lib/sh/ddev-hosts.sh ./files/opencode-permissions-kit-lib/sh/fs-baseline.sh ./files/opencode-permissions-kit-lib/sh/wsl-browser-bridge.sh ./files/opencode-permissions-kit-lib/bin/browser-bridge ./files/opencode-permissions-kit-lib/tui/kit-mode.tsx ./files/opencode-permissions-kit-lib/tui/kit-mode-2x.tsx ./files/opencode-permissions-kit-lib/tui/opencode-danger.theme.json ./files/opencode-permissions-kit-lib/tui/tui.json ./files/opencode-permissions-kit-lib/tui/tui-danger.json ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
          E2E_STRICT="${{ inputs.strict == true && '1' || '0' }}" ./tests/e2e/run-docker-rootless.sh
        env:
          OPK_GH_TOKEN: ${{ github.token }}

  # opencode 2.x pin (issue #80): the same suite against the CURRENT 2.x
  # release, resolved from the npm registry at run time — 2.x ships no
  # GitHub release assets (releases/latest stays 1.x). A resolution
  # outside 2.* fails the job loudly: that is the upstream flip the kit
  # must react to (docs/design/opencode-2x.md). Same triggers + docs-only
  # skip as the v1 jobs. The exact cache key is 2x-only and shared with
  # e2e-rootless-2x (parallel saves of the same key are best-effort, one
  # simply wins); the v1 restore prefix warm-starts the OLD binary and
  # installer.
  e2e-2x:
    needs: changes
    # docs-only changes skip; schedule/dispatch always run (see header)
    if: ${{ github.event_name != 'push' && github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve current opencode 2.x (npm dist-tag latest)
        id: version2x
        # linux-x64: runners and the e2e container are amd64 Linux. This is
        # the same npm source tests/e2e/lib.sh downloads the pinned 2.x
        # binary from — the channel the official v2 installer resolves.
        run: |
          OC2="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
              https://registry.npmjs.org/@opencode/cli-linux-x64/latest \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' \
              2>/dev/null || true)"
          case "$OC2" in
            2.*) echo "OC2_VERSION=$OC2" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::npm dist-tag latest is '${OC2:-unresolved}', expected a 2.* version (upstream flip? docs/design/opencode-2x.md)" && exit 1 ;;
          esac
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^OLD_VERSION="\([0-9.]*\)".*/\1/p' tests/e2e/run.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per 2.x version)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          key: opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-npm${{ steps.version2x.outputs.OC2_VERSION }}
          restore-keys: |
            opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run E2E test (opencode 2.x pin)
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/run-ddev.sh ./tests/e2e/lib.sh ./scripts/release.sh ./tests/check-host.sh ./tests/unit/test-opencode-as-opencode.sh ./tests/unit/test-jsonc-parser.sh ./tests/unit/test-git-config.sh ./tests/unit/test-container-backend.sh ./tests/unit/test-bypass-guard.sh ./tests/unit/test-ddev-as-opencode.sh ./tests/unit/test-ddev-migrate.sh ./tests/unit/test-ddev-hosts.sh ./tests/unit/test-mkcert-reuse.sh ./tests/unit/test-wsl-exposure.sh ./tests/unit/test-ui.sh ./tests/unit/test-docs.sh ./tests/unit/test-kit-cli.sh ./tests/unit/test-project-paths.sh ./tests/unit/test-workflows.sh ./tests/unit/test-install-args.sh ./tests/unit/test-kit-files.sh ./tests/unit/test-tui-mode.sh ./tests/unit/test-uninstall.sh ./tests/unit/test-status.sh ./tests/unit/test-update-flags.sh ./tests/unit/test-release.sh ./tests/unit/test-fs-baseline.sh ./tests/unit/test-browser-bridge.sh ./tests/unit/test-e2e-sources.sh \
            ./files/install.sh ./files/etc/umask.sh ./files/opencode-permissions-kit-lib/management/config.sh ./files/opencode-permissions-kit-lib/management/update.sh ./files/opencode-permissions-kit-lib/management/uninstall.sh ./files/opencode-permissions-kit-lib/management/status.sh ./files/opencode-permissions-kit-lib/bin/opencode-as-opencode ./files/opencode-permissions-kit-lib/bin/opk ./files/opencode-permissions-kit-lib/sh/log.sh ./files/opencode-permissions-kit-lib/sh/ui.sh ./files/opencode-permissions-kit-lib/sh/shell-warn.sh ./files/opencode-permissions-kit-lib/bin/setup-container-backend ./files/opencode-permissions-kit-lib/bin/socket-check ./files/opencode-permissions-kit-lib/bin/cwd-check ./files/opencode-permissions-kit-lib/sh/ddev-terminal.sh ./files/opencode-permissions-kit-lib/sh/ddev-handover.sh ./files/opencode-permissions-kit-lib/sh/ddev-migrate.sh ./files/opencode-permissions-kit-lib/bin/ddev-migrate ./files/opencode-permissions-kit-lib/sh/ddev-hosts.sh ./files/opencode-permissions-kit-lib/sh/fs-baseline.sh ./files/opencode-permissions-kit-lib/sh/wsl-browser-bridge.sh ./files/opencode-permissions-kit-lib/bin/browser-bridge ./files/opencode-permissions-kit-lib/tui/kit-mode.tsx ./files/opencode-permissions-kit-lib/tui/kit-mode-2x.tsx ./files/opencode-permissions-kit-lib/tui/opencode-danger.theme.json ./files/opencode-permissions-kit-lib/tui/tui.json ./files/opencode-permissions-kit-lib/tui/tui-danger.json ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
          E2E_OC_VERSION=${{ steps.version2x.outputs.OC2_VERSION }} ./tests/e2e/run.sh
        env:
          OPK_GH_TOKEN: ${{ github.token }}

  # docker-rootless daemon e2e, opencode 2.x pin (issue #80) — the same
  # mirrored trigger/cache layout as its v1 job above; see e2e-2x for the
  # npm resolution rationale and e2e-rootless for the skip semantics.
  e2e-rootless-2x:
    needs: changes
    # docs-only changes skip; schedule/dispatch always run (see header)
    if: ${{ github.event_name != 'push' && github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve current opencode 2.x (npm dist-tag latest)
        id: version2x
        run: |
          OC2="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
              https://registry.npmjs.org/@opencode/cli-linux-x64/latest \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' \
              2>/dev/null || true)"
          case "$OC2" in
            2.*) echo "OC2_VERSION=$OC2" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::npm dist-tag latest is '${OC2:-unresolved}', expected a 2.* version (upstream flip? docs/design/opencode-2x.md)" && exit 1 ;;
          esac
      - name: Read pinned OLD version (for cache key)
        id: old
        run: |
          echo "OLD_VERSION=$(sed -n 's/^OLD_VERSION="\([0-9.]*\)".*/\1/p' tests/e2e/run.sh | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per 2.x version, shared with e2e-2x)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          key: opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-npm${{ steps.version2x.outputs.OC2_VERSION }}
          restore-keys: |
            opencode-e2e-2x-old${{ steps.old.outputs.OLD_VERSION }}-
            opencode-e2e-old${{ steps.old.outputs.OLD_VERSION }}-
      - name: Run docker-rootless E2E test (opencode 2.x pin)
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/run-ddev.sh ./tests/e2e/lib.sh ./scripts/release.sh ./tests/check-host.sh ./tests/unit/test-update-flags.sh ./tests/unit/test-release.sh \
            ./tests/unit/test-opencode-as-opencode.sh ./tests/unit/test-jsonc-parser.sh ./tests/unit/test-git-config.sh ./tests/unit/test-container-backend.sh ./tests/unit/test-bypass-guard.sh ./tests/unit/test-ddev-as-opencode.sh ./tests/unit/test-ddev-migrate.sh ./tests/unit/test-ddev-hosts.sh ./tests/unit/test-mkcert-reuse.sh ./tests/unit/test-wsl-exposure.sh ./tests/unit/test-ui.sh ./tests/unit/test-docs.sh ./tests/unit/test-kit-cli.sh ./tests/unit/test-project-paths.sh ./tests/unit/test-workflows.sh ./tests/unit/test-install-args.sh ./tests/unit/test-kit-files.sh ./tests/unit/test-tui-mode.sh ./tests/unit/test-uninstall.sh ./tests/unit/test-status.sh ./tests/unit/test-fs-baseline.sh ./tests/unit/test-browser-bridge.sh ./tests/unit/test-e2e-sources.sh \
            ./files/install.sh ./files/etc/umask.sh ./files/opencode-permissions-kit-lib/management/config.sh ./files/opencode-permissions-kit-lib/management/update.sh ./files/opencode-permissions-kit-lib/management/uninstall.sh ./files/opencode-permissions-kit-lib/management/status.sh ./files/opencode-permissions-kit-lib/bin/opencode-as-opencode ./files/opencode-permissions-kit-lib/bin/opk ./files/opencode-permissions-kit-lib/sh/log.sh ./files/opencode-permissions-kit-lib/sh/ui.sh ./files/opencode-permissions-kit-lib/sh/shell-warn.sh ./files/opencode-permissions-kit-lib/bin/setup-container-backend ./files/opencode-permissions-kit-lib/bin/socket-check ./files/opencode-permissions-kit-lib/bin/cwd-check ./files/opencode-permissions-kit-lib/sh/ddev-terminal.sh ./files/opencode-permissions-kit-lib/sh/ddev-handover.sh ./files/opencode-permissions-kit-lib/sh/ddev-migrate.sh ./files/opencode-permissions-kit-lib/bin/ddev-migrate ./files/opencode-permissions-kit-lib/sh/ddev-hosts.sh ./files/opencode-permissions-kit-lib/sh/fs-baseline.sh ./files/opencode-permissions-kit-lib/sh/wsl-browser-bridge.sh ./files/opencode-permissions-kit-lib/bin/browser-bridge ./files/opencode-permissions-kit-lib/tui/kit-mode.tsx ./files/opencode-permissions-kit-lib/tui/kit-mode-2x.tsx ./files/opencode-permissions-kit-lib/tui/opencode-danger.theme.json ./files/opencode-permissions-kit-lib/tui/tui.json ./files/opencode-permissions-kit-lib/tui/tui-danger.json ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
          E2E_STRICT="${{ inputs.strict == true && '1' || '0' }}" E2E_OC_VERSION=${{ steps.version2x.outputs.OC2_VERSION }} ./tests/e2e/run-docker-rootless.sh
        env:
          OPK_GH_TOKEN: ${{ github.token }}
