name: test-e2e-ddev

# Real-ddev e2e suite (tests/e2e/run-ddev.sh, internal/records/ddev-e2e-test.md).
# Runs on master pushes and manual dispatch. NOT on pull requests (test-e2e.yml
# keeps the PR gate): this suite downloads GBs of images and runs a real
# ddev project lifecycle — too heavy per PR, but master is the staging
# area for the 'stable' release mirror and must be fully green before a
# release is cut (scripts/release.sh includes these runs in its CI gate).
# A daily schedule (05:27 UTC; issue #78 ran it weekly until
# 2026-10-23) re-runs the suite on
# master even when nothing was pushed — the design doc's planned
# burn-in (§8/R6): the suite installs the LATEST ddev and rebuilds the
# golden image warm from scratch, catching ddev/opencode release drift
# between pushes. Push and scheduled runs include the FULL catalog
# (camino site tier on, latest ddev) — master is the pre-release gate
# and the real-site tier is exactly the burn-in class this suite exists
# for (proven CI-green 2026-08-23); manual dispatch can deselect the
# site tier for a lean skeleton run.
# CI rebuilds the golden image warm every run (the cache is a
# local-workspace concept, design doc §6 R6).
#
# The e2e-ddev-2x job runs the suite against the CURRENT opencode 2.x
# release (issue #197): all real installations run 2.x, and
# 2.x ships via the npm registry, not GitHub releases (releases/latest
# stays 1.x), so the job resolves the npm dist-tag 'latest' at run time
# and fails loudly when that tag ever leaves 2.* — the upstream flip
# the kit must react to (internal/records/opencode-2x.md). The
# e2e-ddev-1x twin keeps 1.x an explicit lane (GitHub releases/latest,
# loud failure when that leaves 1.*). Same (heavy) triggers as the
# 2x job: master pushes, daily schedule, manual dispatch — not
# PRs.
#
# Path filtering (non-e2e-input changes skip): push runs first detect
# what changed (dorny/paths-filter) — the 'code' set is the same e2e
# INPUT set as test-e2e.yml (files/**, tests/e2e/**, .github/**,
# Makefile, VERSION; rationale documented there). When NOTHING in it
# changed, the suite job skips with a green
# 'skipped' conclusion (job-level on purpose: the run still EXISTS for
# its sha, so scripts/release.sh's gate — which accepts skipped but not
# absent runs — stays satisfied even on a non-code master push; and a
# non-code push never cuts a release anyway). Job-level skipping is
# safe here because this workflow has NO matrix jobs (test-e2e.yml's
# git pair are explicit single-channel jobs for exactly that reason: a
# job-level `if` on a matrix collapses the legs, required expanded-leg
# checks never report, and the PR hangs — if a matrix is ever added
# here anyway, gate it at STEP level). Schedule and manual dispatch always run (drift checks /
# explicit human intent — the GB downloads are the point there).
# test-unit.yml is NOT filtered: test-docs.sh validates links across
# docs/ + root Markdown.
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      site_tier:
        description: 'Run the real-site tier (camino fixture, DD10-DD12) — always on for push/schedule'
        required: false
        default: true
        type: boolean
      ddev_version:
        description: 'Pin a ddev version (e.g. v1.25.3); empty = latest release'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '27 5 * * *'  # daily 05:27 UTC (after test-e2e's verdict)

permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push. Scheduled runs
# get their own group: a scheduled run must never cancel an in-flight
# push run of the same ref (a cancelled run on a master sha reads as
# red to scripts/release.sh's CI gate) — and conversely stays alive to
# deliver its drift verdict even when master moves under it.
concurrency:
  group: >-
    e2e-ddev-${{ github.event_name == 'schedule' && 'daily'
    || (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref
    || 'manual' }}
  cancel-in-progress: true

jobs:
  # Changed-path detection for the skip logic (header comment above).
  # 'code' is true when any e2e INPUT changed (files/ kit, the suite
  # itself, the workflows, the invocation, the version).
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'files/**'
              - 'tests/e2e/**'
              - '.github/**'
              - 'Makefile'
              - 'VERSION'

  e2e-ddev-2x:
    needs: changes
    # non-code changes skip; schedule/dispatch always run (see header)
    if: >-
      ${{ github.event_name != 'push' && github.event_name != 'pull_request'
      || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Resolve current opencode 2.x (npm dist-tag latest)
        id: version2x
        # Default lane = 2.x since the issue #197 flip. linux-x64: runners
        # and the e2e container are amd64 Linux; this is the same npm
        # source tests/e2e/lib.sh resolves/downloads through. Anchored
        # validation before the value reaches GITHUB_OUTPUT or the cache
        # key — the packument is npm-registry-derived (untrusted).
        run: |
          OC2="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
              https://registry.npmjs.org/@opencode/cli-linux-x64/latest \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' \
              2>/dev/null || true)"
          if printf '%s' "$OC2" | grep -qE '^2\.[0-9]+(\.[0-9]+)*$'; then
            echo "OC2_VERSION=$OC2" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm dist-tag latest is '${OC2:-unresolved}', expected a 2.x semver \
                (upstream flip? internal/records/opencode-2x.md)" && exit 1
          fi
      - name: Cache opencode binaries + installer (per 2.x version, shared with the other e2e jobs)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          # Key scheme of the former 2x lane (warm across the issue #197
          # flip). No trailing dash on the restore prefixes: they must
          # prefix-match the primary keys of previous runs
          # (opencode-e2e-2x-... from the e2e workflow's 2x-era jobs and
          # this file's former 2x job, opencode-e2e-latest<ver> from the
          # v1-era ddev job) to warm-start the binary on version bumps.
          key: opencode-e2e-2x-npm${{ steps.version2x.outputs.OC2_VERSION }}
          restore-keys: |
            opencode-e2e-2x-
            opencode-e2e-latest
      - name: Run real-ddev E2E test
        env:
          E2E_DDEV_SITE: >-
            ${{ (github.event_name != 'workflow_dispatch' || inputs.site_tier == true)
            && 'camino' || 'none' }}
          DDEV_VERSION: ${{ inputs.ddev_version }}
          # Base image via the Google Docker Hub mirror: auth.docker.io
          # 504s (2026-10) killed every suite at metadata resolve. (Inner
          # ddev image pulls still go to Docker Hub directly.)
          E2E_BASE_IMAGE: mirror.gcr.io/library/ubuntu:24.04
          # Authorize api.github.com calls (rate-limit resilience, lib.sh
          # gh_latest_tag resolves the ddev version) — the ephemeral
          # workflow token, no secret needed.
          OPK_GH_TOKEN: ${{ github.token }}
        run: |
          ./tests/e2e/run-ddev.sh

      - name: Summary
        if: always()
        env:
          E2E_DDEV_SITE: >-
            ${{ (github.event_name != 'workflow_dispatch' || inputs.site_tier == true)
            && 'camino' || 'none' }}
          DDEV_VERSION: ${{ inputs.ddev_version }}
          # Via env, never interpolated into the run: shell (S6).
          E2E_OC_VERSION: ${{ steps.version2x.outputs.OC2_VERSION }}
        run: |
          echo "### ddev-e2e-2x (run-ddev.sh, opencode ${E2E_OC_VERSION:-unresolved})" >> "$GITHUB_STEP_SUMMARY"
          echo "- site tier: ${E2E_DDEV_SITE:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ddev: ${DDEV_VERSION:-latest}" >> "$GITHUB_STEP_SUMMARY"

  # opencode 1.x lane (issue #197): the same suite against the CURRENT
  # 1.x release, resolved from GitHub releases/latest at run time — the
  # explicit legacy-major lane while the kit still ships 1.x support
  # (OPENCODE_MAJOR gating, v1 config shapes). A resolution outside 1.*
  # fails the job loudly: when GitHub flips releases/latest to 2.x, this
  # lane's premise is gone and the kit must drop it (the mirror image of
  # the default lane's 2.x flip signal, internal/records/opencode-2x.md).
  # Same (heavy) triggers as the 2x job: master pushes, daily
  # schedule, manual dispatch — not PRs (the GB downloads are the point
  # there).
  e2e-ddev-1x:
    needs: changes
    # non-code changes skip; schedule/dispatch always run (see header)
    if: >-
      ${{ github.event_name != 'push' && github.event_name != 'pull_request'
      || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode 1.x (GitHub releases/latest)
        id: version
        # 0.0.45c C8 contract kept through the issue #197 flip:
        # authenticated + anchored-validated against the lane's expected
        # major — a bad resolution fails the step, never a silently
        # degraded cache key.
        env:
          OPK_GH_TOKEN: ${{ github.token }}
        run: |
          OCV="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
              -H "Authorization: Bearer $OPK_GH_TOKEN" \
              https://api.github.com/repos/anomalyco/opencode/releases/latest \
              | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')"
          if printf '%s' "$OCV" | grep -qE '^1\.[0-9]+(\.[0-9]+)*$'; then
            echo "OC_VERSION=$OCV" >> "$GITHUB_OUTPUT"
          else
            echo "::error::opencode releases/latest resolved '${OCV:-unresolved}', expected a 1.x semver \
                (upstream flip? internal/records/opencode-2x.md)" && exit 1
          fi
      - name: Cache opencode binaries (per 1.x version, warm-start from the other e2e caches)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          # The v1-era ddev default keys (opencode-e2e-latest<ver>): warm
          # from every pre-flip default run. No trailing dash: the prefix
          # must prefix-match the primary keys of previous runs.
          key: opencode-e2e-latest${{ steps.version.outputs.OC_VERSION }}
          restore-keys: |
            opencode-e2e-latest
      - name: Run real-ddev E2E test (opencode 1.x pin)
        env:
          E2E_DDEV_SITE: >-
            ${{ (github.event_name != 'workflow_dispatch' || inputs.site_tier == true)
            && 'camino' || 'none' }}
          DDEV_VERSION: ${{ inputs.ddev_version }}
          # Resolved 1.x version travels via env, never interpolated into
          # the run: shell (S6: defense-in-depth on top of the anchored check).
          E2E_OC_VERSION: ${{ steps.version.outputs.OC_VERSION }}
          # Base image via the Google Docker Hub mirror: auth.docker.io
          # 504s (2026-10) killed every suite at metadata resolve. (Inner
          # ddev image pulls still go to Docker Hub directly.)
          E2E_BASE_IMAGE: mirror.gcr.io/library/ubuntu:24.04
          # Authorize api.github.com calls (rate-limit resilience, lib.sh
          # gh_latest_tag resolves the ddev version) — the ephemeral
          # workflow token, no secret needed.
          OPK_GH_TOKEN: ${{ github.token }}
        run: |
          ./tests/e2e/run-ddev.sh
      - name: Summary
        if: always()
        env:
          E2E_DDEV_SITE: >-
            ${{ (github.event_name != 'workflow_dispatch' || inputs.site_tier == true)
            && 'camino' || 'none' }}
          DDEV_VERSION: ${{ inputs.ddev_version }}
          # Via env, never interpolated into the run: shell (S6).
          E2E_OC_VERSION: ${{ steps.version.outputs.OC_VERSION }}
        run: |
          echo "### ddev-e2e-1x (run-ddev.sh, opencode ${E2E_OC_VERSION:-unresolved})" >> "$GITHUB_STEP_SUMMARY"
          echo "- site tier: ${E2E_DDEV_SITE:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ddev: ${DDEV_VERSION:-latest}" >> "$GITHUB_STEP_SUMMARY"
