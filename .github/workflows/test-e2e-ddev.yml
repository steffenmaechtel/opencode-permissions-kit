name: test-e2e-ddev

# Real-ddev e2e suite (tests/e2e/run-ddev.sh, docs/design/ddev-e2e-test.md).
# Runs on master pushes and manual dispatch. NOT on pull requests (test-e2e.yml
# keeps the PR gate): this suite downloads GBs of images and runs a real
# ddev project lifecycle — too heavy per PR, but master is the staging
# area for the 'stable' release mirror and must be fully green before a
# release is cut (scripts/release.sh includes these runs in its CI gate).
# A weekly schedule (Mon 03:27 UTC, issue #78) re-runs the suite on
# master even when nothing was pushed — the design doc's planned
# burn-in (§8/R6): the suite installs the LATEST ddev and rebuilds the
# golden image warm from scratch, catching ddev/opencode release drift
# between pushes. Push and scheduled runs use the defaults (no camino
# site tier, latest ddev); the inputs only apply to manual dispatch.
# CI rebuilds the golden image warm every run (the cache is a
# local-workspace concept, design doc §6 R6).
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      site_tier:
        description: 'Also run the real-site tier (camino fixture, DD10-DD12)'
        required: false
        default: false
        type: boolean
      ddev_version:
        description: 'Pin a ddev version (e.g. v1.25.3); empty = latest release'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '27 3 * * 1'  # Mondays 03:27 UTC (after test-e2e's verdict)

permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same ref; also
# dedupes if two events somehow fire for the same push. Scheduled runs
# get their own group: a weekly run must never cancel an in-flight
# push run of the same ref (a cancelled run on a master sha reads as
# red to scripts/release.sh's CI gate) — and conversely stays alive to
# deliver its drift verdict even when master moves under it.
concurrency:
  group: e2e-ddev-${{ github.event_name == 'schedule' && 'weekly' || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ddev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Resolve opencode version
        id: version
        run: |
          echo "OC_VERSION=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 https://api.github.com/repos/anomalyco/opencode/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Cache opencode binaries + installer (per version, shared with the other e2e jobs)
        uses: actions/cache@v6
        with:
          path: tests/e2e/cache
          key: opencode-e2e-latest${{ steps.version.outputs.OC_VERSION }}
          restore-keys: |
            opencode-e2e-latest-
      - name: Run real-ddev E2E test
        env:
          E2E_DDEV_SITE: ${{ inputs.site_tier == true && 'camino' || '' }}
          DDEV_VERSION: ${{ inputs.ddev_version }}
        run: |
          chmod +x ./tests/e2e/run.sh ./tests/e2e/run-docker-rootless.sh ./tests/e2e/run-ddev.sh ./tests/e2e/lib.sh ./tests/check-host.sh ./tests/unit/test-opencode-as-opencode.sh ./tests/unit/test-jsonc-parser.sh ./tests/unit/test-git-config.sh ./tests/unit/test-container-backend.sh ./tests/unit/test-bypass-guard.sh ./tests/unit/test-ddev-as-opencode.sh ./tests/unit/test-ddev-migrate.sh ./tests/unit/test-ddev-hosts.sh ./tests/unit/test-mkcert-reuse.sh ./tests/unit/test-wsl-exposure.sh ./tests/unit/test-ui.sh ./tests/unit/test-docs.sh ./tests/unit/test-kit-cli.sh ./tests/unit/test-project-paths.sh ./tests/unit/test-workflows.sh ./tests/unit/test-install-args.sh ./tests/unit/test-kit-files.sh ./tests/unit/test-tui-mode.sh ./tests/unit/test-uninstall.sh ./tests/unit/test-status.sh ./tests/unit/test-update-flags.sh ./tests/unit/test-release.sh ./tests/unit/test-fs-baseline.sh \
            ./files/install.sh ./files/etc/umask.sh ./files/opencode-permissions-kit-lib/management/config.sh ./files/opencode-permissions-kit-lib/management/update.sh ./files/opencode-permissions-kit-lib/management/uninstall.sh ./files/opencode-permissions-kit-lib/management/status.sh ./files/opencode-permissions-kit-lib/bin/opencode-as-opencode ./files/opencode-permissions-kit-lib/bin/opk ./files/opencode-permissions-kit-lib/sh/log.sh ./files/opencode-permissions-kit-lib/sh/ui.sh ./files/opencode-permissions-kit-lib/sh/shell-warn.sh ./files/opencode-permissions-kit-lib/bin/setup-container-backend ./files/opencode-permissions-kit-lib/bin/socket-check ./files/opencode-permissions-kit-lib/bin/cwd-check ./files/opencode-permissions-kit-lib/sh/ddev-terminal.sh ./files/opencode-permissions-kit-lib/sh/ddev-handover.sh ./files/opencode-permissions-kit-lib/sh/ddev-migrate.sh ./files/opencode-permissions-kit-lib/bin/ddev-migrate ./files/opencode-permissions-kit-lib/sh/ddev-hosts.sh ./files/opencode-permissions-kit-lib/sh/fs-baseline.sh ./files/opencode-permissions-kit-lib/tui/kit-mode.tsx ./files/opencode-permissions-kit-lib/tui/opencode-danger.theme.json ./files/opencode-permissions-kit-lib/tui/tui.json ./files/opencode-permissions-kit-lib/tui/tui-danger.json ./files/opencode-permissions-kit-lib/bin/ddev-as-opencode
          ./tests/e2e/run-ddev.sh
      - name: Summary
        if: always()
        env:
          E2E_DDEV_SITE: ${{ inputs.site_tier == true && 'camino' || '' }}
          DDEV_VERSION: ${{ inputs.ddev_version }}
        run: |
          echo "### ddev-e2e (run-ddev.sh)" >> "$GITHUB_STEP_SUMMARY"
          echo "- site tier: ${E2E_DDEV_SITE:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ddev: ${DDEV_VERSION:-latest}" >> "$GITHUB_STEP_SUMMARY"
